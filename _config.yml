related_posts: 3
title: EdilExtreme
baseurl: ""
url: "https://edilextreme.com"
email: ""
description: >-
  Lavori in quota su doppia fune: grondaie, facciate, tetti, messa in sicurezza. Operatori certificati, sopralluogo e preventivo gratuiti.
footer_text: "&copy; 2026 EdilExtreme"
twitter_username: username
github_username: username
minimal_mistakes_skin: default
search: true

# SEO globale
author:
  name: "Andrew"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Ciao, sono Andrew fondatore di EdilExtreme, sono disponibile per qualsiasi richiesta. Grazie per l'attenzione."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/"

social:
  name: CMSPush
  links:
    - https://twitter.com/username
    - https://github.com/cialdecompatibili-netizen

twitter:
  username: username

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
exclude:
  - vendor
  - docs

permalink: /:categories/:title/

timezone:

collections:
  products:
    output: false
    permalink: /shop/:name/
  servizi:
    output: true
    permalink: /servizi/:name/
  progetti:
    output: true
    permalink: /progetti/:name/

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: products
    values:
      layout: product
      classes: wide
  - scope:
      path: ""
      type: servizi
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: progetti
    values:
      layout: single
      author_profile: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

cms_homepage:

# Numero WhatsApp con prefisso, senza + e senza spazi (es. 393331234567). Vuoto = bottone nascosto
whatsapp: "393281970254"
